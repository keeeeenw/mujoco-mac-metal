[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mujoco-mac-metal"
version = "0.4.0"
description = "Experimental generalized MuJoCo Metal physics profiles"
readme = "PYPI_README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "mujoco==3.10.0",
  "numpy>=2,<3",
  "torch==2.9.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.urls]
Homepage = "https://github.com/keeeeenw/mujoco-mac-metal"
Repository = "https://github.com/keeeeenw/mujoco-mac-metal"
Documentation = "https://github.com/keeeeenw/mujoco-mac-metal/blob/main/metal/INSTALL.md"

[project.scripts]
mujoco-metal = "mujoco_metal.__main__:main"

[project.optional-dependencies]
metal = ["torch==2.9.1"]
test = ["absl-py", "pytest"]
demo = ["pillow"]

[tool.setuptools]
packages = ["mujoco_metal", "mujoco_metal.examples"]
package-dir = {"mujoco_metal.examples" = "examples"}

[tool.setuptools.package-data]
mujoco_metal = ["shaders/*.metal", "pinned_enums.json", "pinned_surface.json"]
"mujoco_metal.examples" = ["*.xml", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = ["gpu: requires explicit opt-in and an idle Apple GPU"]

[tool.pyink]
line-length = 80
pyink-indentation = 2
pyink-use-majority-quotes = true

[tool.isort]
profile = "google"
line_length = 80
